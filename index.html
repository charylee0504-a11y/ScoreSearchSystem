    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var hex="";
  for(i=0;i<8;i++){var x=H[i];for(var j=3;j>=0;j--){var by=(x>>>(j*8))&255;hex+=(by<16?"0":"")+by.toString(16);}}
  return hex;
}

function searchScore(){

    hideError();

    let name=document.getElementById("stuName").value.trim();

    let id=document.getElementById("stuId").value.trim().toUpperCase();

    if(name===""){

        showError("请输入学生姓名！");

        return;

    }

    if(id===""){

        showError("请输入身份证号码！");

        return;

    }

    let stu=null;

    for(let i=0;i<scoreData.length;i++){

        if(scoreData[i].name===name){

            stu=scoreData[i];

            break;

        }

    }

    if(stu==null){

        showError("未找到该学生，请检查姓名是否正确！");

        return;

    }

    if(idData[name]!==hashId(id)){

        showError("身份证号码错误，请重新输入！");

        return;

    }

    document.getElementById("result").style.display="block";

    document.getElementById("rName").innerHTML=name;

    document.getElementById("rId").innerHTML=id;

    document.getElementById("rTotal").innerHTML=stu.total;

    document.getElementById("rRank").innerHTML=stu.rank;

    document.getElementById("yw").innerHTML=stu.yw;

    document.getElementById("sx").innerHTML=stu.sx;

    document.getElementById("yy").innerHTML=stu.yy;

    document.getElementById("szsx").innerHTML=stu.szsx;

    document.getElementById("ae").innerHTML=stu.ae;

    document.getElementById("wy").innerHTML=stu.wy;

    document.getElementById("xl").innerHTML=stu.xl;

    document.getElementById("ls").innerHTML=stu.ls;

    document.getElementById("xx").innerHTML=stu.xx;

}

document.getElementById("stuName").addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        searchScore();

    }

});

document.getElementById("stuId").addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        searchScore();

    }

});

document.getElementById("stuId").addEventListener("input",function(){

    this.value=this.value.toUpperCase();

});
